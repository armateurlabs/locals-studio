name: Build macOS installers
run-name: Build macOS installers for ${{ github.ref_name }}

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: arm64
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app, service sidecar, DMG, and verified PKG
        run: npm run desktop:build -- --ci -- --locked

      - name: Verify the app signature and DMG integrity
        shell: bash
        run: |
          codesign --verify --deep --strict "target/release/bundle/macos/Locals Studio.app"
          for dmg in target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: locals-studio-dmg-macos-arm64-${{ github.sha }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload PKG
        uses: actions/upload-artifact@v7
        with:
          name: locals-studio-pkg-macos-arm64-${{ github.sha }}
          path: target/release/bundle/pkg/*.pkg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
